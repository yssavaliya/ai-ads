<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Content Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}static/site.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ root }}index.html">✦ Content Hub</a>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Generated by the Self-Learning Content Intelligence Platform. Review before posting — nothing is auto-posted.
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ root }}static/site.js" defer></script>
</body>
</html>
