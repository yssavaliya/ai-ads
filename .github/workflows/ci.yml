name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Provide ffmpeg for the Reel integration tests (static build from pip, no apt)
        timeout-minutes: 5
        continue-on-error: true  # the integration tests skip themselves when ffmpeg is missing
        run: |
          exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$HOME/.local/ffbin" && ln -sf "$exe" "$HOME/.local/ffbin/ffmpeg"
          echo "$HOME/.local/ffbin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Tests
        run: python -m pytest -q --cov=src --cov-report=term --cov-fail-under=80  # measured 84% locally (ffmpeg tests add more in CI)

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell syntax of helper scripts
        run: bash -n .github/scripts/run_pipeline.sh

      - name: actionlint (workflows + composite actions)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -shellcheck=

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Known-vulnerability scan of the runtime dependencies (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: No credential-shaped strings in tracked files
        run: |
          if git grep -nIE '(gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|hf_[A-Za-z0-9]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|apify_api_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests'; then
            echo "::error::a credential-shaped string is committed"; exit 1
          fi
