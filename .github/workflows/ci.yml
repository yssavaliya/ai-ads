name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Provide ffmpeg for the Reel integration tests (static build from pip, no apt)
        timeout-minutes: 5
        continue-on-error: true  # the integration tests skip themselves when ffmpeg is missing
        run: |
          exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$HOME/.local/ffbin" && ln -sf "$exe" "$HOME/.local/ffbin/ffmpeg"
          echo "$HOME/.local/ffbin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Tests
        run: python -m pytest -q

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax of helper scripts
        run: bash -n .github/scripts/run_pipeline.sh

      - name: actionlint (workflows + composite actions)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -shellcheck=
