name: Weekly Deep Dive

on:
  schedule:
    - cron: "30 2 * * 0"   # Sunday 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  models: read
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
      SITE_SECRET: ${{ secrets.SITE_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
      FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
      LLM_KEYLESS_FALLBACK: ${{ vars.LLM_KEYLESS_FALLBACK }}
      BELOW_THRESHOLD_POLICY: ${{ vars.BELOW_THRESHOLD_POLICY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          site: "true"

      - name: Run weekly pipeline
        run: bash .github/scripts/run_pipeline.sh src.scheduler.weekly_job

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/learning_ledger.jsonl data/businesses.json
          message: "chore: weekly run state"

      - uses: ./.github/actions/publish-site
        if: always()
