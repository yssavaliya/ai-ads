name: Weekly Deep Dive

on:
  schedule:
    - cron: "30 2 * * 0"   # Sunday 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent

      - name: Run weekly pipeline
        run: bash .github/scripts/run_pipeline.sh src.scheduler.weekly_job

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/businesses.json
          message: "chore: weekly run state"
