name: Daily Content Intelligence

on:
  schedule:
    - cron: "30 12 * * 1,3,5"   # 18:00 IST, Monday/Wednesday/Friday
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post immediately to Instagram via Buffer (skip queue)"
        type: boolean
        default: false
      reel_only:
        description: "Only queue a rendered Reel with at least 60 seconds of narration"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FORCE_REEL_ONLY: ${{ inputs.reel_only || 'false' }}
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
      SITE_SECRET: ${{ secrets.SITE_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
      FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
      LLM_KEYLESS_FALLBACK: ${{ vars.LLM_KEYLESS_FALLBACK }}
      BELOW_THRESHOLD_POLICY: ${{ vars.BELOW_THRESHOLD_POLICY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      # Open-weight Apache-2.0 models only; inference is hosted by Groq and Cloudflare.
      LLM_PROVIDER_ORDER: groq
      IMAGE_PROVIDER_ORDER: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          state_encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY || secrets.FEEDBACK_SIGNING_KEY }}
          site: "true"
          piper: "true"

      - name: Run daily pipeline
        run: bash .github/scripts/run_pipeline.sh src.scheduler.daily_job

      - name: Upload prompt logs and rendered assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-output-${{ github.run_id }}
          path: |
            logs/prompts/
            logs/assets/
            logs/preview/
          if-no-files-found: ignore

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/learning_ledger.jsonl data/businesses.json data/engagement_log.jsonl data/site_manifests
          message: "chore: daily run state"
          state_encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY || secrets.FEEDBACK_SIGNING_KEY }}

      - uses: ./.github/actions/publish-site
        if: always()

      - name: Publish top creative to Buffer
        if: success()
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS || secrets.BUFFER_PROFILE_ID }}
          BUFFER_NOW: ${{ inputs.post_now || vars.BUFFER_NOW || 'false' }}
          # Queue automatically after automated claims, media, duplicate, and queue-capacity checks.
          # Set the repository variable BUFFER_DRAFT_MODE to true to force drafts as an emergency override.
          BUFFER_DRAFT_MODE: ${{ vars.BUFFER_DRAFT_MODE || 'false' }}
          BUFFER_QUEUE_LIMIT: ${{ vars.BUFFER_QUEUE_LIMIT || '8' }}
          BUFFER_REEL_ONLY: ${{ inputs.reel_only || 'false' }}
        run: |
          if [ "$BUFFER_REEL_ONLY" = "true" ]; then
            python scripts/publish_buffer.py --reel-only
          else
            python scripts/publish_buffer.py
          fi

      - name: Commit the published log
        if: always()
        run: |
          # Written after the post is created, so the main persist step (which runs earlier) cannot carry it.
          [ -e data/published_log.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/published_log.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: published log $(date -u +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::could not push the published log"

      - name: Alert on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[pipeline] workflow failed - ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Run: %s\nTrigger: %s\nCommit: %s\n\nOpen the run, read the failed step, and close this issue once a later run is green.\n' "$RUN_URL" "$EVENT" "$SHA")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '[.[] | select(.title == env.ALERT_TITLE)] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          fi
