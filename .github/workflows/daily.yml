name: Daily Content Intelligence

on:
  schedule:
    - cron: "29 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore agent.db cache
        uses: actions/cache@v4
        with:
          path: |
            agent.db
            agent.db-wal
            agent.db-shm
          key: agent-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            agent-db-${{ runner.os }}-

      - name: Restore piper voice cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-v1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install piper-tts pillow

      - name: Verify creative-rendering dependencies
        run: |
          set -e
          echo "ffmpeg: $(ffmpeg -version | head -1)"
          echo "ffprobe: $(ffprobe -version | head -1)"
          command -v piper >/dev/null || {
            echo "::error::piper binary not found on PATH after 'pip install piper-tts' — Reel voiceover would fail silently later"
            exit 1
          }
          echo "piper: found at $(command -v piper)"

      - name: Run daily pipeline
        run: |
          python -m src.scheduler.daily_job 2>&1 | while IFS= read -r line; do
            echo "$line"
            if [[ "$line" == *"::error::"* ]]; then
              echo "::error::${line#*::error::}"
            elif [[ "$line" == *"::warning::"* ]]; then
              echo "::warning::${line#*::warning::}"
            else
              echo "::notice::$line"
            fi
          done

      - name: Upload prompt logs and rendered assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_id }}
          path: |
            logs/prompts/
            logs/assets/
            logs/preview/
          if-no-files-found: ignore

      - name: Persist JSON state (agent.db stays in cache, not git)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weights.json data/businesses.json data/lead_seen.json data/engagement_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily run state $(date -u +'%Y-%m-%d')"
            git pull --rebase -X ours origin main
            git push
          fi
