name: Discover Business Leads

on:
  schedule:
    - cron: "30 3 * * 1"   # Monday 09:00 IST
  workflow_dispatch:
    inputs:
      niches:
        description: "Comma-separated niches (one-off override, not committed)"
        required: false
      target_count:
        description: "Number of leads to generate prompts for (one-off override, not committed)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          piper: "true"

      - name: Apply one-off dispatch overrides (never committed)
        env:
          INPUT_NICHES: ${{ github.event.inputs.niches }}
          INPUT_TARGET_COUNT: ${{ github.event.inputs.target_count }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('data/lead_config.json'))
          niches = os.environ.get('INPUT_NICHES', '')
          if niches.strip():
              cfg['niches'] = [n.strip() for n in niches.split(',') if n.strip()]
          count = os.environ.get('INPUT_TARGET_COUNT', '').strip()
          if count.isdigit():
              cfg['target_count'] = int(count)
          json.dump(cfg, open('data/lead_config.json', 'w'), indent=2)
          PY

      - name: Run lead pipeline
        run: bash .github/scripts/run_pipeline.sh src.scheduler.lead_job

      - name: Upload prompt logs and rendered assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-output-${{ github.run_id }}
          path: |
            logs/prompts/
            logs/assets/
            logs/preview/
          if-no-files-found: ignore

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/leads.json data/lead_seen.json data/lead_rejected.json data/weights.json data/engagement_log.jsonl
          discard: data/lead_config.json
          message: "chore: lead discovery state"
