name: Secrets Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify GROQ + GEMINI (via real pipeline code)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_llm.py

      - name: Verify APIFY_TOKEN
        env:
          KEY: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then echo "APIFY_TOKEN: MISSING"; exit 0; fi
          resp=$(curl -s --max-time 30 -w "\n%{http_code}" \
            -H "Authorization: Bearer $KEY" \
            "https://api.apify.com/v2/users/me")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" = "200" ]; then
            echo "APIFY_TOKEN: OK"
          else
            echo "APIFY_TOKEN: FAIL (HTTP $code)"
            echo "--- response body (first 300 chars) ---"
            echo "$body" | head -c 300
          fi

      - name: Verify HF_TOKEN (optional)
        env:
          KEY: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then echo "HF_TOKEN: MISSING (optional)"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" \
            --max-time 30 \
            "https://huggingface.co/api/whoami")
          if [ "$code" = "200" ]; then echo "HF_TOKEN: OK"; else echo "HF_TOKEN: FAIL (HTTP $code)"; fi

      - name: Verify Gmail SMTP (only when e-mail delivery is enabled)
        env:
          USER: ${{ secrets.SMTP_USER }}
          PASS: ${{ secrets.SMTP_PASSWORD }}
          DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
        run: |
          case "${DELIVERY_MODE:-site}" in email|both) ;; *) echo "SMTP: skipped (DELIVERY_MODE=${DELIVERY_MODE:-site} does not send e-mail)"; exit 0 ;; esac
          if [ -z "$USER" ] || [ -z "$PASS" ]; then echo "SMTP: MISSING"; exit 0; fi
          python3 - <<'PY'
          import os, smtplib
          user, pwd = os.environ["USER"], os.environ["PASS"]
          try:
              s = smtplib.SMTP("smtp.gmail.com", 587, timeout=30)
              s.ehlo(); s.starttls(); s.ehlo(); s.login(user, pwd); s.quit()
              print("SMTP: OK")
          except Exception as e:
              print("SMTP: FAIL (%s: %s)" % (type(e).__name__, str(e).splitlines()[0]))
          PY
