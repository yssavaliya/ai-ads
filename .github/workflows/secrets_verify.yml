name: Secrets Verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify GROQ_API_KEY
        env:
          KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "GROQ_API_KEY: MISSING"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"ping"}]}' \
            --max-time 30)
          if [ "$code" = "200" ]; then echo "GROQ_API_KEY: OK"; else echo "GROQ_API_KEY: FAIL (HTTP $code)"; fi

      - name: Verify GEMINI_API_KEY
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "GEMINI_API_KEY: MISSING"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"ping"}]}]}' \
            --max-time 30)
          if [ "$code" = "200" ]; then echo "GEMINI_API_KEY: OK"; else echo "GEMINI_API_KEY: FAIL (HTTP $code)"; fi

      - name: Verify APIFY_TOKEN
        env:
          KEY: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then echo "APIFY_TOKEN: MISSING"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" \
            --max-time 30 \
            "https://api.apify.com/v2/user")
          if [ "$code" = "200" ]; then echo "APIFY_TOKEN: OK"; else echo "APIFY_TOKEN: FAIL (HTTP $code)"; fi

      - name: Verify HF_TOKEN (optional)
        env:
          KEY: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then echo "HF_TOKEN: MISSING (optional)"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" \
            --max-time 30 \
            "https://huggingface.co/api/whoami")
          if [ "$code" = "200" ]; then echo "HF_TOKEN: OK"; else echo "HF_TOKEN: FAIL (HTTP $code)"; fi

      - name: Verify Gmail SMTP
        env:
          USER: ${{ secrets.SMTP_USER }}
          PASS: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$USER" ] || [ -z "$PASS" ]; then echo "SMTP: MISSING"; exit 0; fi
          python3 - <<'PY'
          import os, smtplib
          user, pwd = os.environ["USER"], os.environ["PASS"]
          try:
              s = smtplib.SMTP("smtp.gmail.com", 587, timeout=30)
              s.ehlo(); s.starttls(); s.ehlo(); s.login(user, pwd); s.quit()
              print("SMTP: OK")
          except Exception as e:
              print("SMTP: FAIL (%s: %s)" % (type(e).__name__, str(e).splitlines()[0]))
          PY
