name: Onboard Business

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Business name"
        required: true
      website_url:
        description: "Website URL"
        required: true
      instagram_handle:
        description: "Instagram handle (without @)"
        required: false
      linkedin_handle:
        description: "LinkedIn handle"
        required: false
      email:
        description: "Recipient email"
        required: true
      virality_threshold:
        description: "Virality threshold (0-100)"
        required: false
        default: "75"

permissions:
  contents: write
  issues: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      OPENCODE_COMMAND: opencode
      OPENCODE_TIMEOUT_SECONDS: "300"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: opencode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            opencode-${{ runner.os }}-

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install chromium --with-deps

      - name: Onboard business
        run: |
          python scripts/onboard_business.py \
            --name "${{ github.event.inputs.name }}" \
            --website "${{ github.event.inputs.website_url }}" \
            --instagram "${{ github.event.inputs.instagram_handle }}" \
            --linkedin "${{ github.event.inputs.linkedin_handle }}" \
            --email "${{ github.event.inputs.email }}" \
            --threshold "${{ github.event.inputs.virality_threshold }}"

      - name: Persist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f agent.db data/businesses.json data/weights.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: onboard ${{ github.event.inputs.name }}"
            git pull --rebase -X ours origin main
            git push
          fi