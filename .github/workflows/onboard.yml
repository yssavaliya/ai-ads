name: Onboard Business

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Business name"
        required: true
      website_url:
        description: "Website URL"
        required: true
      instagram_handle:
        description: "Instagram handle (without @)"
        required: false
      linkedin_handle:
        description: "LinkedIn handle"
        required: false
      email:
        description: "Recipient email (or env:NAME to read it from a secret/variable)"
        required: true
      virality_threshold:
        description: "Virality threshold (0-100)"
        required: false
        default: "75"
      run_daily_now:
        description: "Trigger the Daily workflow right after onboarding"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  models: read
  issues: write
  actions: write   # lets the final step dispatch daily.yml

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
      SITE_SECRET: ${{ secrets.SITE_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
      FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
      LLM_KEYLESS_FALLBACK: ${{ vars.LLM_KEYLESS_FALLBACK }}
      BELOW_THRESHOLD_POLICY: ${{ vars.BELOW_THRESHOLD_POLICY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          site: "true"

      - name: Onboard business
        env:
          IN_NAME: ${{ github.event.inputs.name }}
          IN_WEBSITE: ${{ github.event.inputs.website_url }}
          IN_INSTAGRAM: ${{ github.event.inputs.instagram_handle }}
          IN_LINKEDIN: ${{ github.event.inputs.linkedin_handle }}
          IN_EMAIL: ${{ github.event.inputs.email }}
          IN_THRESHOLD: ${{ github.event.inputs.virality_threshold }}
        run: |
          python scripts/onboard_business.py \
            --name "$IN_NAME" \
            --website "$IN_WEBSITE" \
            --instagram "$IN_INSTAGRAM" \
            --linkedin "$IN_LINKEDIN" \
            --email "$IN_EMAIL" \
            --threshold "${IN_THRESHOLD:-75}"

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/businesses.json data/weights.json data/learning_ledger.jsonl
          message: "chore: onboard business"

      - name: Trigger the Daily workflow
        if: success() && github.event.inputs.run_daily_now == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: ./.github/actions/publish-site
        if: always()
