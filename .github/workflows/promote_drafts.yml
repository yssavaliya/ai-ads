name: Promote Buffer Drafts

on:
  schedule:
    # Run daily at 10:00 IST (04:30 UTC) — gives you ~16 hours to review
    # after the daily pipeline creates drafts at 18:00 IST.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: "Minimum draft age (hours) before auto-promoting"
        type: string
        default: "24"
      max_age_hours:
        description: "Maximum draft age (hours) before deleting as stale"
        type: string
        default: "168"
      queue_limit:
        description: "Override the queue capacity for this run (e.g. 10 to preview scheduling in a dry run)"
        type: string
        required: false
      dry_run:
        description: "Report what would be scheduled without changing Buffer"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-ads-buffer-drafts
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS || secrets.BUFFER_PROFILE_ID }}
      BUFFER_QUEUE_LIMIT: ${{ inputs.queue_limit || vars.BUFFER_QUEUE_LIMIT || '3' }}
      DRAFT_MIN_AGE_HOURS: ${{ inputs.min_age_hours || vars.DRAFT_MIN_AGE_HOURS || '24' }}
      DRAFT_MAX_AGE_HOURS: ${{ inputs.max_age_hours || vars.DRAFT_MAX_AGE_HOURS || '168' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      AUTO_SCHEDULE_MIN_SCORE: ${{ vars.AUTO_SCHEDULE_MIN_SCORE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            scripts/promote_drafts.py
            src/__init__.py
            src/delivery/__init__.py
            src/delivery/buffer_state.py
            src/delivery/draft_review.py
            src/delivery/slot_planner.py
            src/generation/__init__.py
            src/generation/claims.py
            src/shared/__init__.py
            src/shared/brand_facts.py
            requirements.txt
            data/published_log.json
            data/brand_facts.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # the job env carries the Buffer token: install third-party code with a scrubbed environment
        run: env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 python -m pip install -c requirements.txt httpx pydantic-settings

      - name: Promote or clean up drafts
        run: python scripts/promote_drafts.py

      - name: Alert on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[pipeline] workflow failed - ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Run: %s\nTrigger: %s\nCommit: %s\n\nOpen the run, read the failed step, and close this issue once a later run is green.\n' "$RUN_URL" "$EVENT" "$SHA")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '[.[] | select(.title == env.ALERT_TITLE)] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          fi

      - name: Close resolved failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[pipeline] workflow failed - ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A green run resolves the earlier failure alert instead of leaving it open for weeks.
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == env.ALERT_TITLE) | .number'); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Resolved: a later run succeeded ($RUN_URL)."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
          done
