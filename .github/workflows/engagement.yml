name: Sync Instagram Engagement

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent

      - name: Scrape IG engagement and learn
        run: bash .github/scripts/run_pipeline.sh src.learning.auto_learner

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/learning_ledger.jsonl data/engagement_log.jsonl
          message: "chore: engagement sync state"
