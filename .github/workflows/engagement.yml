name: Sync Instagram Engagement

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          state_encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY || secrets.FEEDBACK_SIGNING_KEY }}

      - name: Scrape IG engagement and learn
        run: bash .github/scripts/run_pipeline.sh src.learning.auto_learner

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/learning_ledger.jsonl data/engagement_log.jsonl
          message: "chore: engagement sync state"
          state_encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY || secrets.FEEDBACK_SIGNING_KEY }}

      - name: Alert on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[pipeline] workflow failed - ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Run: %s\nTrigger: %s\nCommit: %s\n\nOpen the run, read the failed step, and close this issue once a later run is green.\n' "$RUN_URL" "$EVENT" "$SHA")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '[.[] | select(.title == env.ALERT_TITLE)] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          fi
