name: Drift Check

# Proactively detects model/API drift (e.g. a retired model name or an invalid key)
# by running the same LLM code paths the pipeline uses. On failure it opens (or
# updates) a GitHub issue AND fails the run, so the breakage is noticed before the
# next scheduled run silently produces nothing.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  models: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-agent

      - name: Verify LLM providers
        id: check
        continue-on-error: true
        shell: bash   # bash -eo pipefail: `| tee` must not hide a failing check
        run: python scripts/check_llm.py | tee "$RUNNER_TEMP/drift.log"

      - name: List the models each provider offers this key (diagnostic, never fails)
        if: always()
        continue-on-error: true
        run: python scripts/list_models.py

      - name: Open or update the drift alert issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(tail -n 15 "$RUNNER_TEMP/drift.log" | tr '\n' ' ')
          prefix="🚨 Model/API drift detected"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing as of $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Last log lines: ${body}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "${prefix} $(date -u +'%Y-%m-%d')" \
              --body "The scheduled drift check failed — LLM providers returned no output. This usually means a retired model name or an invalid/quota-exhausted key. Last log lines: ${body}. Run the 'Secrets Verify' workflow for a full diagnosis."
          fi

      - name: Fail the run when the providers are down
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::LLM providers failed the drift check — see the alert issue"
          exit 1

      - name: Alert on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[pipeline] workflow failed - ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Run: %s\nTrigger: %s\nCommit: %s\n\nOpen the run, read the failed step, and close this issue once a later run is green.\n' "$RUN_URL" "$EVENT" "$SHA")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '[.[] | select(.title == env.ALERT_TITLE)] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          fi
