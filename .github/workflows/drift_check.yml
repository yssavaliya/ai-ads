name: Drift Check

# Proactively detects model/API drift (e.g. a retired model name or invalid
# key) by running the same LLM code paths the pipeline uses. On failure it
# opens a GitHub issue so the breakage is noticed before the next scheduled
# run silently produces nothing.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify LLM providers
        id: check
        continue-on-error: true
        run: |
          python scripts/check_llm.py | tee /tmp/drift.log

      - name: Open drift alert issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          body=$(tail -n 15 /tmp/drift.log | sed 's/"/\\"/g' | tr '\n' ' ')
          gh issue create \
            --repo "$GITHUB_REPO" \
            --title "🚨 Model/API drift detected $(date -u +'%Y-%m-%d')" \
            --body "The scheduled drift check failed — LLM providers returned no output. This usually means a retired model name or an invalid/quota-exhausted key. Last log lines: \`\`\`${body}\`\`\` Run the 'Secrets Verify' workflow for a full diagnosis."
