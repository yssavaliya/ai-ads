name: Secrets Check

# Manual only: reports which secrets are set (never their values).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report secret presence (values are masked by GitHub — never printed)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          check() {
            name="$1"; required="$2"
            val="${!name}"
            if [ -n "$val" ]; then
              echo "  $name: SET"
            elif [ "$required" = "required" ]; then
              echo "  $name: MISSING  <-- required"
              missing=1
            else
              echo "  $name: not set (optional — a built-in default is used)"
            fi
          }
          missing=0
          echo "Secret presence report (values are NOT shown):"
          check GROQ_API_KEY required
          check GEMINI_API_KEY optional
          check GROQ_MODEL optional
          check GEMINI_MODEL optional
          check APIFY_TOKEN optional
          check SMTP_USER required
          check SMTP_PASSWORD required
          check SMTP_FROM optional
          check HF_TOKEN optional
          if [ "$missing" = "1" ]; then
            echo "::error::one or more required secrets are missing"
            exit 1
          fi
          echo "Done."
