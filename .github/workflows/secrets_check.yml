name: Secrets Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secrets_check.yml"

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report secret presence (values are masked by GitHub — never printed)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          check() {
            name="$1"
            val="${!name}"
            if [ -n "$val" ]; then
              echo "  $name: SET (length ${#val})"
            else
              echo "  $name: MISSING/EMPTY"
            fi
          }
          echo "Secret presence report (values are NOT shown — GitHub masks them in logs):"
          check APIFY_TOKEN
          check GROQ_API_KEY
          check GEMINI_API_KEY
          check SMTP_USER
          check SMTP_PASSWORD
          check SMTP_FROM
          check HF_TOKEN
          echo "Done."
