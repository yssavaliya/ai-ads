name: Secrets Check

# Manual only: reports which secrets are set (never their values).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report secret presence (values are masked by GitHub — never printed)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SITE_SECRET: ${{ secrets.SITE_SECRET }}
          FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
          FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
          LLM_KEYLESS_FALLBACK: ${{ vars.LLM_KEYLESS_FALLBACK }}
        run: |
          check() {
            name="$1"; required="$2"
            val="${!name}"
            if [ -n "$val" ]; then
              echo "  $name: SET"
            elif [ "$required" = "required" ]; then
              echo "  $name: MISSING  <-- required"
              missing=1
            else
              echo "  $name: not set (optional — a built-in default is used)"
            fi
          }
          missing=0
          mode="${DELIVERY_MODE:-site}"
          echo "Delivery mode: $mode   (SMTP is only required for email/both)"
          echo "Secret presence report (values are NOT shown):"
          # at least ONE LLM key is needed unless the keyless fallback is explicitly allowed
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ "$LLM_KEYLESS_FALLBACK" != "true" ]; then
            echo "  LLM: MISSING  <-- set GROQ_API_KEY or GEMINI_API_KEY (or LLM_KEYLESS_FALLBACK=true)"
            missing=1
          fi
          check GROQ_API_KEY optional
          check GEMINI_API_KEY optional
          check GROQ_MODEL optional
          check GEMINI_MODEL optional
          check APIFY_TOKEN optional
          if [ "$mode" = "email" ] || [ "$mode" = "both" ]; then
            check SMTP_USER required
            check SMTP_PASSWORD required
          else
            check SMTP_USER optional
            check SMTP_PASSWORD optional
          fi
          check SMTP_FROM optional
          if [ "$mode" != "email" ]; then check SITE_SECRET required; else check SITE_SECRET optional; fi
          check FEEDBACK_SIGNING_KEY optional
          check FEEDBACK_ALLOWED_USERS optional
          check OWNER_EMAIL optional
          check DIGEST_EMAIL optional
          check HF_TOKEN optional
          if [ "$missing" = "1" ]; then
            echo "::error::one or more required secrets are missing"
            exit 1
          fi
          echo "Done."
