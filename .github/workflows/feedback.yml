name: Process Feedback

on:
  schedule:
    - cron: "0 * * * *"
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore agent.db cache
        uses: actions/cache@v4
        with:
          path: |
            agent.db
            agent.db-wal
            agent.db-shm
          key: agent-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            agent-db-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install piper-tts pillow

      - name: Verify creative-rendering dependencies
        run: |
          set -e
          echo "ffmpeg: $(ffmpeg -version | head -1)"
          command -v piper >/dev/null || {
            echo "::error::piper binary not found on PATH — REGENERATE reel voiceover would fail"
            exit 1
          }
          echo "piper: found at $(command -v piper)"

      - name: Process feedback issues
        run: python -m src.learning.process_feedback

      - name: Persist JSON state (agent.db stays in cache, not git)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weights.json data/engagement_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: feedback run state $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -X ours origin main
            git push
          fi
