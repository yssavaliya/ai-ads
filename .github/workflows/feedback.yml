name: Process Feedback

on:
  schedule:
    - cron: "0 * * * *"
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore agent.db cache
        uses: actions/cache@v4
        with:
          path: |
            agent.db
            agent.db-wal
            agent.db-shm
          key: agent-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            agent-db-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Process feedback issues
        run: python -m src.learning.process_feedback

      - name: Persist JSON state (agent.db stays in cache, not git)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weights.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: feedback run state $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -X ours origin main
            git push
          fi
