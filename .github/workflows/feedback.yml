name: Process Feedback

on:
  schedule:
    - cron: "0 * * * *"
  issues:
    # `edited` matters: a "📎 I posted this" issue is left open until the user
    # pastes the post URL into it, and that edit should be picked up immediately.
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  models: read
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  feedback:
    # Ignore unrelated issues (e.g. the degraded-run / drift tracking issues).
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[content-intel-feedback]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DELIVERY_MODE: ${{ vars.DELIVERY_MODE }}
      SITE_SECRET: ${{ secrets.SITE_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
      FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
      LLM_KEYLESS_FALLBACK: ${{ vars.LLM_KEYLESS_FALLBACK }}
      BELOW_THRESHOLD_POLICY: ${{ vars.BELOW_THRESHOLD_POLICY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Optional repo variable: comma-separated GitHub logins whose feedback issues count
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The job runs hourly but most hours there is no feedback. Checking costs ~3 s; the setup it
      # lets us skip costs ~40 s (Python deps, cache restore, Piper, site checkout).
      - name: Any open feedback issues?
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "content-intel-feedback in:title" --limit 1 --json number --jq length)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          echo "open feedback issues (>=): ${n:-0}"

      - uses: ./.github/actions/setup-agent
        if: steps.pending.outputs.count != '0'
        with:
          site: "true"
          piper: "true"   # REGENERATE can render a voiced Reel

      - name: Process feedback issues
        if: steps.pending.outputs.count != '0'
        run: bash .github/scripts/run_pipeline.sh src.learning.process_feedback

      - uses: ./.github/actions/persist-state
        if: always() && steps.pending.outputs.count != '0'
        with:
          files: data/weights.json data/learning_ledger.jsonl data/engagement_log.jsonl
          message: "chore: feedback run state"

      - uses: ./.github/actions/publish-site
        if: always() && steps.pending.outputs.count != '0'
