name: Process Feedback

on:
  schedule:
    - cron: "0 * * * *"
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      OPENCODE_COMMAND: opencode
      OPENCODE_TIMEOUT_SECONDS: "120"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Process feedback issues
        run: python -m src.learning.process_feedback

      - name: Persist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f agent.db data/weights.json 2>/dev/null || true
          git commit -m "chore: feedback run artifacts $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push