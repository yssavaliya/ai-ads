name: Process Feedback

on:
  schedule:
    - cron: "0 * * * *"
  issues:
    # `edited` matters: a "📎 I posted this" issue is left open until the user
    # pastes the post URL into it, and that edit should be picked up immediately.
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-ads-repo-state
  cancel-in-progress: false

jobs:
  feedback:
    # Ignore unrelated issues (e.g. the degraded-run / drift tracking issues).
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[content-intel-feedback]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Optional repo variable: comma-separated GitHub logins whose feedback issues count
      FEEDBACK_ALLOWED_USERS: ${{ vars.FEEDBACK_ALLOWED_USERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent
        with:
          piper: "true"   # REGENERATE can render a voiced Reel

      - name: Process feedback issues
        run: bash .github/scripts/run_pipeline.sh src.learning.process_feedback

      - uses: ./.github/actions/persist-state
        if: always()
        with:
          files: data/weights.json data/engagement_log.jsonl
          message: "chore: feedback run state"
