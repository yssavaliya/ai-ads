name: Setup agent
description: >
  Python 3.12 + project install + restore of the Actions-cached state
  (agent.db and the intel cache). Pair it with persist-state at the end of the job.

inputs:
  piper:
    description: Install Piper TTS and restore its voice cache (Reel voiceover)
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Restore agent.db + intel cache
      uses: actions/cache/restore@v4
      with:
        path: |
          agent.db
          agent.db-wal
          agent.db-shm
          data/cache
        key: agent-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          agent-db-${{ runner.os }}-

    - name: Restore Piper voice cache
      if: inputs.piper == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/piper-voices
        key: piper-voices-v1

    - name: Install dependencies
      shell: bash
      env:
        WITH_PIPER: ${{ inputs.piper }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        if [ "$WITH_PIPER" = "true" ]; then python -m pip install piper-tts; fi

    - name: Check render dependencies (warn only — Reels fall back to images)
      if: inputs.piper == 'true'
      shell: bash
      run: |
        command -v ffmpeg >/dev/null || echo "::warning::ffmpeg not found — Reels will fall back to still images"
        command -v piper >/dev/null || echo "::warning::piper not found — Reels will be silent or fall back to images"
        echo "ffmpeg: $(command -v ffmpeg || echo missing) | piper: $(command -v piper || echo missing)"
