name: Setup agent
description: >
  Python 3.12 + project install + restore of the Actions-cached state
  (agent.db and the intel cache). Pair it with persist-state at the end of the job.

inputs:
  piper:
    description: Install Piper TTS and restore its voice cache (Reel voiceover)
    default: "false"
  site:
    description: Restore the published website (gh-pages) into ./site so pipelines can add to it
    default: "false"
  state_encryption_key:
    description: Fernet key used to decrypt the private database/cache artifact
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Restore encrypted agent state
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .agent-state.enc
        key: agent-state-v1-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          agent-state-v1-${{ runner.os }}-

    - name: Restore Piper voice cache
      if: inputs.piper == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/piper-voices
        key: piper-voices-v1

    - name: Restore published site (gh-pages)
      if: inputs.site == 'true'
      shell: bash
      run: |
        rm -rf site
        repo_url="https://x-access-token:${GITHUB_TOKEN:-none}@github.com/${GITHUB_REPOSITORY}.git"
        if git ls-remote --exit-code --heads "$repo_url" gh-pages >/dev/null 2>&1; then
          git clone --quiet --depth 1 --branch gh-pages "$repo_url" site
          rm -rf site/.git
          echo "Restored site: $(find site -type f | wc -l) files"
        else
          mkdir -p site
          echo "No gh-pages branch yet — starting a fresh site"
        fi

    - name: Install dependencies
      shell: bash
      env:
        WITH_PIPER: ${{ inputs.piper }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        if [ "$WITH_PIPER" = "true" ]; then python -m pip install piper-tts; fi

    - name: Decrypt private agent state
      if: inputs.state_encryption_key != '' && hashFiles('.agent-state.enc') != ''
      shell: bash
      env:
        STATE_ENCRYPTION_KEY: ${{ inputs.state_encryption_key }}
      run: python scripts/state_cache.py decrypt

    - name: Skip private state restore without encryption key
      if: inputs.state_encryption_key == ''
      shell: bash
      run: echo "::warning::STATE_ENCRYPTION_KEY is not configured; cached prompts and intel history are unavailable"

    - name: Provide ffmpeg (static build from pip; no apt mirrors that can stall the job)
      if: inputs.piper == 'true'
      shell: bash
      continue-on-error: true  # Reels fall back to still images; never block the pipeline on this
      run: |
        # NOTE: composite-action steps do not accept `timeout-minutes` (the runner rejects the whole
        # action file: "Unexpected value 'timeout-minutes'"), so the bound is applied with timeout(1).
        if ! command -v ffmpeg >/dev/null; then
          timeout 300 python -m pip install --quiet imageio-ffmpeg
          exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$HOME/.local/ffbin"
          ln -sf "$exe" "$HOME/.local/ffbin/ffmpeg"
          echo "$HOME/.local/ffbin" >> "$GITHUB_PATH"
        fi

    - name: Check render dependencies (warn only — Reels fall back to images)
      if: inputs.piper == 'true'
      shell: bash
      run: |
        command -v ffmpeg >/dev/null || echo "::warning::ffmpeg not found — Reels will fall back to still images"
        command -v piper >/dev/null || echo "::warning::piper not found — Reels will be silent or fall back to images"
        echo "ffmpeg: $(command -v ffmpeg || echo missing) | piper: $(command -v piper || echo missing)"
