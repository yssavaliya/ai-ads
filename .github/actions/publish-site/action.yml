name: Publish site
description: >
  Push the static website (the `site/` folder the pipelines updated) to the
  `gh-pages` branch as a single orphan commit, so media never piles up in git
  history. A no-op unless a pipeline marked the site dirty. Needs contents: write.

runs:
  using: composite
  steps:
    - name: Push site to gh-pages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ ! -f site/.dirty ]; then
          echo "Site unchanged — nothing to publish"
          exit 0
        fi
        rm -f site/.dirty

        cd site
        git init -q -b gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Publish site $(date -u +'%Y-%m-%d %H:%M UTC')"
        # The token goes in a per-command auth header, never into the remote URL (it would end up in
        # .git/config and in any error output that echoes the URL).
        echo "::add-mask::${GH_TOKEN}"
        AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
        echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        gh_git() { git -c "http.https://github.com/.extraheader=${AUTH}" "$@"; }

        # Rollback point: keep the previous site as gh-pages-backup before it is overwritten.
        if gh_git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
          gh_git push -q -f origin FETCH_HEAD:refs/heads/gh-pages-backup || echo "::warning::could not update gh-pages-backup"
        fi

        for attempt in 1 2 3; do
          if gh_git push -f origin gh-pages; then
            echo "Site pushed (attempt $attempt)"
            # Smoke test: the remote head is our commit and it contains the entry page.
            remote="$(gh_git ls-remote origin refs/heads/gh-pages | cut -f1)"
            if [ "$remote" != "$(git rev-parse HEAD)" ] || ! git cat-file -e HEAD:index.html; then
              echo "::error::post-publish check failed (remote=$remote). The previous site is on gh-pages-backup."
              exit 1
            fi
            cd ..
            {
              echo "### Content Hub updated"
              python -c "from src.delivery.site_publisher import SitePublisher; print('\n'.join(SitePublisher().summary()))"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::site push attempt $attempt failed; retrying"
          sleep $((attempt * 5))
        done
        echo "::error::could not push the site to gh-pages after 3 attempts"
        exit 1
