name: Persist state
description: >
  Commit the JSON state files a pipeline changed (retrying on push races) and save
  agent.db to the Actions cache. Safe to run with `if: always()`: a failed run still
  keeps the DB rows for prompts that were already emailed.

inputs:
  files:
    description: Space-separated state files to commit when they exist and changed
    required: true
  message:
    description: Commit message prefix
    required: true
  discard:
    description: Space-separated tracked files to reset (one-off overrides that must not be committed)
    default: ""
  state_encryption_key:
    description: Fernet key used to encrypt the private database/cache artifact
    required: false

runs:
  using: composite
  steps:
    - name: Commit state
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        DISCARD: ${{ inputs.discard }}
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        for f in $DISCARD; do git checkout -- "$f" 2>/dev/null || true; done

        # Stage each file on its own: `git add a b` aborts entirely if ONE path is
        # missing, which silently dropped every state file before.
        for f in $FILES; do
          if [ -e "$f" ]; then git add -- "$f"; fi
        done

        if git diff --cached --quiet; then
          echo "No state changes to commit"
          exit 0
        fi

        git commit -m "$MESSAGE $(date -u +'%Y-%m-%d %H:%M')"
        for attempt in 1 2 3; do
          if git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "State pushed (attempt $attempt)"
            exit 0
          fi
          echo "::warning::push attempt $attempt failed; retrying"
          git rebase --abort 2>/dev/null || true
          sleep $((attempt * 5))
        done
        echo "::error::could not push state after 3 attempts"
        exit 1

    - name: Encrypt private agent state
      if: always() && inputs.state_encryption_key != ''
      shell: bash
      env:
        STATE_ENCRYPTION_KEY: ${{ inputs.state_encryption_key }}
      run: python scripts/state_cache.py encrypt

    - name: Warn if private state cache encryption is unavailable
      if: always() && inputs.state_encryption_key == ''
      shell: bash
      run: echo "::warning::STATE_ENCRYPTION_KEY is not configured; private agent state was not cached"

    - name: Save encrypted agent state
      if: always() && inputs.state_encryption_key != ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .agent-state.enc
        key: agent-state-v1-${{ runner.os }}-${{ github.run_id }}
